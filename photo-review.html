<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bil Hana Photo Review</title><style>body{font-family:system-ui;background:#f6f7f8;color:#17212b;margin:0;padding:24px}main{max-width:1150px;margin:auto}h1{margin-bottom:8px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0001}.card img{width:100%;height:190px;object-fit:cover;border-radius:10px;background:#eee}.card a{color:#075cb1}small{display:block;color:#555;margin:8px 0}button{padding:8px 14px;border:1px solid #aaa;border-radius:8px;background:#fff;cursor:pointer}.status{font-weight:700;color:#a33}footer{margin-top:24px}</style></head><body><main><h1>مراجعة صور وصفات بالهنا</h1><p class="muted">صور موجودة بالفعل في الموقع. المقارنة مع اسم الوصفة والمصدر قبل الموافقة؛ هذه الصفحة لا تعدل الصور تلقائيًا.</p><div class="grid" id="cards"></div><footer>حالة المراجعة محلية في المتصفح فقط؛ لا تعتبر اعتمادًا في GitHub.</footer></main><script>const items=[{"id":"v19_6","name":"شوربة شوفان"},{"id":"v19_11","name":"فول بالبيض"},{"id":"extra6","name":"جبنة قديمة بالطماطم"},{"id":"extra15","name":"قرص فلاحي"},{"id":"v19_40","name":"محشي بصل"},{"id":"v19_42","name":"فاصوليا بيضاء"},{"id":"extra2","name":"صينية بطاطس بالفراخ"},{"id":"extra17","name":"جمبري إسكندراني"},{"id":"extra7","name":"سلطة طحينة"},{"id":"extra13","name":"بلح الشام"},{"id":"v19_52","name":"هريسة سميد"}];const root=document.getElementById('cards');items.forEach(x=>{let c=document.createElement('article');c.className='card';let h=document.createElement('h2');h.textContent=x.name;let im=document.createElement('img');im.src='assets/photos/'+x.id+'.webp';im.alt=x.name;im.loading='lazy';let p=document.createElement('p');p.className='status';p.textContent='تحتاج مراجعة';let a=document.createElement('a');a.href='https://github.com/3bHussein/Bil_Hana/blob/main/PROVISIONAL-PHOTO-SOURCES.csv';a.target='_blank';a.rel='noopener';a.textContent='بيانات المصدر والترخيص';let b=document.createElement('button');b.textContent='تحديد كمراجعة محلية';b.onclick=()=>{p.textContent='تمت المعاينة محليًا — لم تعتمد';};c.append(h,im,p,a,document.createElement('br'),b);root.append(c)});</script></body></html>
