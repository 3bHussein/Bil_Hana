name: Import verified recipe photos
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'
permissions:
  contents: write
concurrency:
  group: recipe-photo-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Download reviewed Commons images and rebuild manifest
        run: python fetch_reviewed_photos.py
      - name: Validate assets and licenses
        run: |
          python verify_assets.py
          python verify_photo_licenses.py
      - name: Commit only validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html PHOTO-CREDITS.csv assets/photos/
          if ! git diff --cached --quiet; then
            git commit -m "photos: import reviewed licensed recipe photographs"
            git push
          fi
